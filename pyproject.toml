[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-project-manager"
version = "0.3.1"
description = "GUI to inspect and clean up Claude Code and Codex projects/sessions"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ai-pm = "ai_project_manager.__main__:main"

[tool.setuptools.packages.find]
include = ["ai_project_manager*"]
